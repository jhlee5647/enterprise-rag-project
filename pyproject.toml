[project]
name = "enterprise-rag"
version = "0.1.0"
description = "JUUL 사내 문서 RAG PoC"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-lg",
    "httpx>=0.27",
    "langchain-community<0.4",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pyarrow>=17",
    "pyyaml>=6",
    "qdrant-client>=1.19.1",
    "ragas>=0.4.3",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag = "enterprise_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
