# 경로와 파라미터를 모은 config. 상대 경로는 이 파일이 있는 폴더 기준이다.

paths:
  documents: data/documents.parquet   # 문서 표 (collect 결과)
  sample_ids: data/sample_ids.txt     # 뽑힌 문서 ID 목록, 한 줄에 하나
  collect_log: data/collect.log       # 수집 로그: 칸별 목표·수집·부족 수, 건너뛴 문서와 사유
  index: data/index                   # 색인 (Qdrant 로컬 모드 폴더, index 결과)
  eval_set: data/eval_set.csv        # 검수된 평가셋 (gen-eval이 쓰고 사람이 keep을 적은 CSV)
  runs: runs                          # 실행 결과 폴더들. eval --run-name <이름>이면 runs/<이름>/
  pii_answers: data/pii_answers.csv   # PII 정답셋 (gen-eval이 초안을 쓰고 사람이 PII 목록을 고친 CSV)

idl:
  solr_url: https://metadata.idl.ucsf.edu/solr/ltdl3/query
  s3_url: https://ucsf-idl-dataset.s3.amazonaws.com

collect:
  seed: 42          # Solr sort=random_<seed> asc
  quota: 1000       # 칸(부서 × 문서 종류)마다 뽑을 문서 수
  doc_types: [email, document, presentation]
  # JUUL 밖에서 만든 외부 문서 종류. q에 NOT type:(...)으로 붙여 뺀다.
  excluded_types: [publication, article, news, transcript, video, audio]
  # 연결표: IDL 토픽 → 부서 (ADR-0001)
  departments:
    Marketing: marketing
    Government & Public Affairs: regulatory
    Product Design & Quality: product

index:
  chunk_size: 512     # 청크 길이 (임베딩 모델의 토큰 수)
  chunk_overlap: 64   # 앞 청크와 겹치는 토큰 수

pii:
  types: [NAME, EMAIL, PHONE]   # PII 종류 목록: index가 가명 토큰([NAME] 등)으로 가릴 종류
  # 실명을 찾는 NER 모델. PoC는 Presidio 기본 모델을 쓰고, 다음 단계에서 바꿀 수 있다 (설계 기록 11번)
  spacy_model: en_core_web_lg

embedding:
  model: Qwen/Qwen3-Embedding-0.6B   # 앱 프로세스 안에서 실행한다

ask:
  acl_filter: true   # 켜면 질문한 부서가 허용 부서에 없는 청크를 검색 전에 뺀다
  retrieval: dense   # 검색 방식. dense만 구현
  reranker: none     # 리랭커. none(그대로 통과)만 구현
  top_k: 5           # 검색 결과 중 쓸 청크 수

llm:
  model: Qwen/Qwen3-8B                 # vLLM에 띄운 모델 이름. thinking 모드는 요청마다 끈다
  base_url: http://localhost:8000/v1   # vLLM 서버 (OpenAI 호환 API)

gen_eval:
  seed: 42                      # 부서마다 생성에 쓸 문서를 고를 때 쓰는 시드
  docs_per_department: 30       # 부서마다 질문을 만들 문서 수. RAGAS가 이 문서들로 지식 그래프를 만든다
  questions_per_department: 15  # 부서마다 만들 질문 수
  pii_chunks: 50                # PII 정답셋 초안에 넣을 원문 청크 수. 청크는 seed로 고른다
  query_distribution:           # 질문 유형 비율 (RAGAS query_distribution)
    single_hop: 0.5
    multi_hop_specific: 0.25
    multi_hop_abstract: 0.25
